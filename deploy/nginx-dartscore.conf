# Pretty *.local names on one Raspberry Pi, one server block per app.
# Install:
#   sudo cp deploy/nginx-dartscore.conf /etc/nginx/sites-available/dartscore
#   sudo ln -s /etc/nginx/sites-available/dartscore /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Names are advertised by Avahi — see deploy/avahi-hosts.

server {
    listen 80;
    server_name dartboard.local;

    location / {
        proxy_pass http://127.0.0.1:8080;   # DartScore (Environment=PORT=8080)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

